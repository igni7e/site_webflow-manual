            - paragraph [ref=e306]: 翻訳アイコンが出ない場合は、ページ内の何もない場所を右クリックし、表示されるメニューから「日本語に翻訳」を選びます。
            - heading "翻訳アイコンが出ない時" [level=2] [ref=e307]
