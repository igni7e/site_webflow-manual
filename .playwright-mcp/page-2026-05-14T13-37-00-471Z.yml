              - listitem [ref=e311]: 「設定」を開きます。
              - listitem [ref=e312]: 「言語」を開きます。
              - listitem [ref=e313]: 「Google 翻訳を使用する」をオンにします。
              - listitem [ref=e314]: 必要に応じて、翻訳先の言語を日本語にします。
