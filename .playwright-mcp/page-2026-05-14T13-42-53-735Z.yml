      - main [ref=e265]:
        - heading "Content Editor入門：テキスト・画像・リンクを安全に更新する" [level=1] [ref=e268]
        - generic [ref=e270]:
          - generic [ref=e271]:
            - heading "Content Editor入門：テキスト・画像・リンクを安全に更新する" [level=1] [ref=e272]
            - paragraph [ref=e273]: Content editor roleは、Webflowサイトの見た目を確認しながら、文章・画像・リンクなどのコンテンツを更新するための役割です。サイトの構造やデザインを変更せずに作業できるため、日常的な更新はContent editor roleで行うのが安全です。
            - paragraph [ref=e274]: 従来のLegacy Editorは2026年8月4日から利用できなくなる予定です。この章では、公開版として最新のContent editor roleを前提に説明します。
            - heading "作業全体の流れ" [level=2] [ref=e275]
            - list [ref=e276]:
              - listitem [ref=e277]: Content editor roleでWebflowを開きます。
              - listitem [ref=e278]: 更新したいテキストを編集します。
              - listitem [ref=e279]: 必要に応じて画像を差し替えます。
              - listitem [ref=e280]: ボタンや文章のリンク先を確認・変更します。
              - listitem [ref=e281]: 変更内容を確認します。
              - listitem [ref=e282]: 問題がなければPublishします。
            - heading "Webflowを開く" [level=2] [ref=e283]
            - paragraph [ref=e284]:
              - text: WebflowにログインしてDashboardから対象サイトを開く方法と、サイトURLの末尾に
              - code [ref=e285]: "?update"
              - text: を付けて直接開く方法があります。サイトごとに権限や案内URLが異なる場合があるため、初回は制作担当者から共有された方法を優先してください。
            - paragraph [ref=e286]:
              - text: 詳しい手順は
              - link "No.9 Content editor roleでWebflowを開く方法" [ref=e287] [cursor=pointer]:
                - /url: /02-editor/01-open-editor/
              - text: を確認してください。
            - heading "テキストを編集する" [level=2] [ref=e288]
            - list [ref=e289]:
              - listitem [ref=e290]: 編集したい文章にマウスを合わせます。
              - listitem [ref=e291]: 編集アイコン、または編集可能なテキスト部分をクリックします。
              - listitem [ref=e292]: 文章を直接入力・削除します。
              - listitem [ref=e293]: 長い文章は、先にGoogle Docsやメモ帳で作ってから貼り付けると安全です。
            - paragraph [ref=e294]:
              - text: 詳しい手順は
              - link "No.10 サイトの文字を書き換える方法" [ref=e295] [cursor=pointer]:
                - /url: /02-editor/02-edit-text/
              - text: を確認してください。
            - heading "画像を差し替える" [level=2] [ref=e296]
            - list [ref=e297]:
              - listitem [ref=e298]: 差し替えたい画像にマウスを合わせます。
              - listitem [ref=e299]: 画像編集アイコンをクリックします。
              - listitem [ref=e300]: 新しい画像ファイルを選択またはドラッグしてアップロードします。
              - listitem [ref=e301]: 公開前に、画像が粗くないか、縦横比が崩れていないか確認します。
            - paragraph [ref=e302]:
              - text: 画像がアップロードできない場合は
              - link "画像アップロードのトラブル" [ref=e303] [cursor=pointer]:
