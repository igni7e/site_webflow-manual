              - link "No.14 リンク先URLを変更する方法" [ref=e308] [cursor=pointer]:
                - /url: /02-editor/06-edit-link-url/
              - text: を確認してください。
            - heading "Publish前に確認する" [level=2] [ref=e309]
            - list [ref=e310]:
              - listitem [ref=e311]: 文章に誤字脱字がない
              - listitem [ref=e312]: 元の意味と違う文章になっていない
              - listitem [ref=e313]: 画像が正しく表示されている
              - listitem [ref=e314]: ボタンやリンクをクリックしたときの遷移先が正しい
              - listitem [ref=e315]: スマートフォン表示で文字や画像が崩れていない
              - listitem [ref=e316]: 変更してはいけない共通パーツを触っていない
            - paragraph [ref=e317]:
