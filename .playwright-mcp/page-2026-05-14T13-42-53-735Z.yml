              - text: も確認してください。
            - heading "リンクを編集する" [level=2] [ref=e304]
            - paragraph [ref=e305]: ボタンや文章リンクのリンク先を変更する場合は、リンク設定画面でURLを確認します。外部サイトへ飛ばすリンクは、必要に応じて新しいタブで開く設定にします。
            - paragraph [ref=e306]:
              - text: リンク作成は
              - link "No.12 文章にリンクを設定する方法" [ref=e307] [cursor=pointer]:
