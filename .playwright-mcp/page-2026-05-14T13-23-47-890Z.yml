            - blockquote [ref=e252]:
              - paragraph [ref=e253]:
                - text: "旧マニュアル番号:"
                - link "No.1" [ref=e254] [cursor=pointer]:
                  - /url: /01-getting-started/01-invitation-email/
            - paragraph [ref=e255]: Webサイトの更新作業を始めるにあたり、最初に行うのがWebflowからの招待メールの確認とアカウント設定です。このマニュアルでは、その最初のステップである「招待メールの確認方法」について詳しく解説します。
            - separator [ref=e256]
            - heading "1. なぜこの作業が必要なの？" [level=2] [ref=e257]
            - paragraph [ref=e258]: お客様がご自身のWebサイトを安全に更新できるように、制作会社がお客様専用の「編集者（Editor）」アカウントをWebflow上で発行しました。
            - paragraph [ref=e259]: この招待メールは、そのアカウントを有効にするための「招待状」です。メール内のリンクをクリックしてアカウント設定を完了することで、初めてサイトの編集画面にログインできるようになります。
            - heading "2. 招待メールの見本" [level=2] [ref=e260]
            - paragraph [ref=e261]: Webflowからの招待メールは、通常以下のような件名と内容で届きます。
            - list [ref=e262]:
              - listitem [ref=e263]:
                - text: "件名:"
                - code [ref=e264]: "[Your Name] invited you to edit the [Site Name] site"
              - listitem [ref=e265]:
                - text: "送信元:"
                - code [ref=e266]: Webflow
                - text: (
                - code [ref=e267]: no-reply@webflow.com
                - text: )
            - paragraph [ref=e268]: "メール本文の例:"
            - figure [ref=e270]:
              - code [ref=e272]:
                - generic [ref=e274]: "--------------------------------------------------"
                - generic [ref=e276]: "[Site Name]"
                - generic [ref=e278]: "[Your Name] invited you to edit the [Site Name] site on Webflow."
                - generic [ref=e282]: "[ Accept Invitation ] (← このボタンをクリックします)"
                - generic [ref=e286]: Thanks,
                - generic [ref=e288]: The Webflow Team
                - generic [ref=e290]: "--------------------------------------------------"
              - button "Copy to clipboard" [ref=e292] [cursor=pointer]
            - heading "3. 招待メールを確認する手順" [level=2] [ref=e294]
            - list [ref=e295]:
              - listitem [ref=e296]: "メールソフトを開く: 普段お使いのメールクライアント（Gmail, Outlookなど）を開きます。"
              - listitem [ref=e297]:
                - text: "受信トレイを確認: Webflow ("
                - code [ref=e298]: no-reply@webflow.com
                - text: ) からのメールが届いているか確認します。
              - listitem [ref=e299]: "迷惑メールフォルダも確認: もし受信トレイに見当たらない場合は、迷惑メールフォルダやプロモーションフォルダに振り分けられている可能性もあります。そちらもご確認ください。"
              - listitem [ref=e300]: "メールを開く: 該当のメールを見つけたら、開いて内容を確認します。"
              - listitem [ref=e301]: "「Accept Invitation」ボタンをクリック: メール本文の中央にある青い「Accept Invitation」ボタンをクリックしてください。"
            - heading "4. よくある質問 (Q&A)" [level=2] [ref=e302]
            - paragraph [ref=e303]: Q. 招待メールが届いていません。どうすればいいですか？ A. まずは迷惑メールフォルダをご確認ください。それでも見つからない場合は、お手数ですがサイトの制作担当者まで「Webflowの招待メールが届いていない」旨をご連絡ください。再送手続きをいたします。
            - paragraph [ref=e304]: Q. 招待メールの有効期限はありますか？ A. はい、招待メールには有効期限が設定されている場合があります。メールが届いたら、なるべく早めにアカウント設定を進めることをお勧めします。もし期限が切れてしまった場合は、同様に制作担当者へ再送をご依頼ください。
            - separator [ref=e305]
